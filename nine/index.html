  }[k];
  return '<svg viewBox="0 0 180 320" role="img" aria-label="'+esc(SEGS[k][3])+'"><defs><clipPath id="ph'+k+'"><rect width="180" height="320" rx="18"/></clipPath></defs>'
    +'<g clip-path="url(#ph'+k+')"><rect width="180" height="320" fill="#EAF2EC"/>'+body+'</g>'
    +'<rect x="2" y="2" width="176" height="316" rx="18" fill="none" stroke="'+ink+'" stroke-width="4"/></svg>';
}
function cutHTML(i){
  var lines=TPL[state.r][state.c], h='';
  h+='<div class="progress">第 '+(i+1)+'／5 句</div><div class="bar"><i style="width:'+((i+1)*20)+'%"></i></div>';
  h+='<div class="cut"><div class="h">第 '+(i+1)+' 句　'+SEGS[i][1]+'<small>'+SEGS[i][0]+'</small></div>';
  h+='<div class="pic">'+shotSVG(i)+'<p>📱 '+HOLD[i]+'<small>'+SEGS[i][3]+'</small></p></div>';
  h+='<div class="say"><span class="lb">🗣 這一句要講</span>「'+mark(fill(lines[i]))+'」</div></div>';
  h+='<p class="tip" style="font-size:20px">講錯了，重拍這一句就好。</p>';
  if(i<4){ h+='<button class="btn" id="nextcut">✅ 這句拍好了，下一句</button>'; }
  else {
    h+='<a class="btn line" href="'+esc(LINE_CHAT)+'">✅ 5 句都拍好了，傳到 LINE</a>';
    h+='<p class="tip">打開 LINE 後點選單的「④ 交作業」，照順序一句一句傳，最後按「傳好了」。我們會幫你接成一支、上字幕。</p>';
  }
  h+='<button class="back" id="prevcut">'+(i?'← 上一句':'← 回九宮格')+'</button>';
  return h;
}
var SCRIPT_URL = "https://drive.google.com/file/d/1QUEIKFPOgBNRCFOd1_j7qGjzR8kiHlZ7/view";
var LINE_URL = "https://line.me/R/oaMessage/@898edwac/?";
var LINE_CHAT = "https://line.me/R/ti/p/@898edwac";
var KEY = "haokang_grid_v1";

var state = { step:1, stall:"fish", kind:"", goods:"", diffText:"", bossText:"", own:false, r:null, c:null };
var app = document.getElementById("app");

function save(){ try{ localStorage.setItem(KEY, JSON.stringify({stall:state.stall,kind:state.kind,goods:state.goods,diffText:state.diffText,bossText:state.bossText,r:state.r,c:state.c,step:state.step,li:state.li||0})); }catch(e){} }
function clearSaved(){ try{ localStorage.removeItem(KEY); }catch(e){} }
function load(){
  try{
    var v = JSON.parse(localStorage.getItem(KEY)||"null");
    if(v && (STALLS[v.stall]||v.stall==="custom") && v.r>=0 && v.r<3 && v.c>=0 && v.c<3){ return v; }
  }catch(e){}
  return null;
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch];}); }

function ownHTML(field,label,ph){
  if(!state.own){ return '<button class="btn choice own" id="own">✏️ 都不像，我自己寫</button>'; }
  return '<label class="q" for="owntxt">'+label+'</label><input class="txt" id="owntxt" maxlength="20" placeholder="'+esc(ph)+'" value="'+esc(state[field])+'">'
       + '<p class="err" id="err"></p><div style="height:12px"></div><button class="btn" id="ownnext" data-field="'+field+'">下一步</button>';
}
function head(n){
  return '<div class="progress">第 '+n+'／3 題</div><div class="bar"><i style="width:'+(n*100/3)+'%"></i></div>';
}
function render(){
  var h = "";
  if(state.step===1){
    h += head(1)+'<h1>你賣什麼？</h1><select id="sel" aria-label="你賣什麼">';
    for(var i=0;i<ORDER.length;i++){ var o=ORDER[i]; h+='<option value="'+o+'"'+(o===state.stall?' selected':'')+'>'+esc(o==="custom"?CUSTOM_LABEL:STALLS[o].label)+'</option>'; }
    h += '</select>';
    if(state.stall==="custom"){
      h += '<label class="q" for="kind">你的店叫什麼？</label><input class="txt" id="kind" maxlength="10" placeholder="例如：雞肉攤、麵包店" value="'+esc(state.kind)+'">';
    }
    h += '<label class="q" for="goods">你主要賣什麼？（可以不填）</label><input class="txt" id="goods" maxlength="8" placeholder="例如：'+esc(base().goods)+'" value="'+esc(state.goods)+'">';
    h += '<p class="err" id="err"></p><div style="height:12px"></div><button class="btn" id="next1">下一步</button>';
  } else if(state.step===2){
    h += head(2)+'<h1>你的東西好在哪？</h1>';
    for(var i=0;i<3;i++){ h+='<button class="btn choice" data-r="'+i+'">'+Q2[i][0]+'<small>'+Q2[i][1]+'</small></button>'; }
    h += ownHTML("diffText","你最不一樣的是？","例如：每天自己去港口挑的");
    h += '<button class="back" id="back">← 上一步</button>';
  } else if(state.step===3){
    h += head(3)+'<h1>你想當哪種老闆？</h1>';
    for(var i=0;i<3;i++){ h+='<button class="btn choice" data-c="'+i+'">'+Q3[i][0]+'<small>'+Q3[i][1]+'</small></button>'; }
    h += ownHTML("bossText","客人會看到一個＿＿的老闆","例如：記得每個客人愛吃什麼");
    h += '<button class="back" id="back">← 上一步</button>';
  } else if(state.step===5){ h += cutHTML(state.li||0); } else { h += resultHTML(); }
  app.innerHTML = h;
  if(!state.keep){ window.scrollTo(0,0); } state.keep=false;
  bind();
}
function pieces(){
  var S = base(), r=state.r, c=state.c;
  var altC = (c===1)?0:1;
  var sentence = "我是"+kind()+"，最不一樣的是"+(state.diffText||S.diff[r])+"，你會看到一個"+(state.bossText||S.boss[c])+"的老闆。";
  return { S:S, main:S.cells[r*3+c], alt:S.cells[r*3+altC], altC:altC, sentence:sentence };
}
function resultHTML(){
  var p = pieces(), S=p.S, r=state.r, c=state.c, h="";
  h += '<div class="big">你的主打：<b>'+esc(p.main)+'</b></div>';
  h += '<div class="grid"><div></div>';
  for(var j=0;j<3;j++){ h+='<div class="gh">'+COLSHORT[j]+'</div>'; }
  for(var i=0;i<3;i++){
    h += '<div class="gh row">'+ROWSHORT[i].split('').join('<br>')+'</div>';
    for(var j=0;j<3;j++){
      var cls = "cell"+((i===r&&j===c)?" main":((i===r&&j===p.altC)?" alt":""));
      h += '<button class="'+cls+'" data-cell="'+i+','+j+'" aria-label="'+esc(S.cells[i*3+j])+'">'+esc(S.short[i*3+j])+'</button>';
    }
  }
  h += '</div><p class="legend">點別的格子，可以換一個主打試試看</p>';
  h += '<div class="card"><p class="t">你的一句話定位</p><p style="margin:0">'+esc(p.sentence)+'</p></div>';
  h += '<button class="btn orange big" id="toscript">確定，幫我出腳本 →</button>';
  h += '<p class="tip">一共 5 句，一句拍一段（每段 3 秒左右），每一句都有拍法圖。剪好是一支 20 秒的影片。</p>';
  h += '<div class="links"><button id="redo">重新選一次</button><a href="../">回首頁</a></div>';
  return h;
}
function lineText(){
  var p = pieces();
  return "我填好九宮格了！\n攤位："+kind()+"（賣"+goods()+"）"+"\n主打："+p.main+"\n一句話："+p.sentence;
}
function lineLink(){ return LINE_URL + encodeURIComponent(lineText()); }

function readInputs(){
  var k=document.getElementById("kind"), g=document.getElementById("goods");
  if(k){ state.kind=k.value.trim(); }
  if(g){ state.goods=g.value.trim(); }
}
function bind(){
  var q;
  if((q=document.getElementById("toscript"))){ q.onclick=function(){ state.li=0; state.step=5; save(); render(); }; }
  if((q=document.getElementById("nextcut"))){ q.onclick=function(){ state.li++; save(); render(); }; }
  if((q=document.getElementById("prevcut"))){ q.onclick=function(){ if(state.li>0){ state.li--; } else { state.step=4; } save(); render(); }; }
  if((q=document.getElementById("sel"))){ q.onchange=function(){ readInputs(); state.stall=this.value; if(state.stall!=="custom"){ state.kind=""; } state.goods=""; state.keep=true; render(); var k=document.getElementById(state.stall==="custom"?"kind":"goods"); if(k){ k.focus(); } }; }
  if((q=document.getElementById("next1"))){ q.onclick=function(){
    readInputs(); state.stall=document.getElementById("sel").value;
    if(state.stall==="custom" && !state.kind){ document.getElementById("err").textContent="請先打你的店叫什麼"; document.getElementById("kind").focus(); return; }
    state.step=2; state.own=false; render(); }; }
  if((q=document.getElementById("own"))){ q.onclick=function(){ state.own=true; state.keep=true; render(); document.getElementById("owntxt").focus(); }; }
  if((q=document.getElementById("ownnext"))){ q.onclick=function(){
    var v=document.getElementById("owntxt").value.trim(), f=this.getAttribute("data-field");
    if(!v){ document.getElementById("err").textContent="打幾個字再按下一步，或點上面的選項"; return; }
    state[f]=v; state.own=false;
    if(f==="diffText"){ state.r=0; state.step=3; render(); }     // 自己寫的特色：腳本先套「東西好」那一列
    else { state.c=1; state.step=4; save(); render(); }           // 自己寫的老闆樣子：腳本先套「鄰居」那一行
  }; }
  var back=document.getElementById("back");
  if(back){ back.onclick=function(){ state.step=state.step-1; state.own=false; render(); }; }
  var bs=document.querySelectorAll("[data-r]");
  for(var i=0;i<bs.length;i++){ bs[i].onclick=function(){ state.r=+this.getAttribute("data-r"); state.diffText=""; state.own=false; state.step=3; render(); }; }
  bs=document.querySelectorAll("[data-c]");
  for(var k=0;k<bs.length;k++){ bs[k].onclick=function(){ state.c=+this.getAttribute("data-c"); state.bossText=""; state.own=false; state.step=4; save(); render(); }; }
  var cs=document.querySelectorAll("[data-cell]");
  for(var z=0;z<cs.length;z++){ cs[z].onclick=function(){ var a=this.getAttribute("data-cell").split(","); state.r=+a[0]; state.c=+a[1]; save(); state.keep=true; render(); }; }
  if((q=document.getElementById("redo"))){ q.onclick=function(){ clearSaved(); state={step:1,stall:state.stall,kind:state.kind,goods:state.goods,diffText:"",bossText:"",own:false,r:null,c:null}; render(); }; }
}
// 啟動：hash 僅供測試預覽（#q2 / #q3 / #fish-0-0），正式使用靠 localStorage
(function(){
  var m = /^#(?:(q[123])|(\w+)-(\d)-(\d)(?:-(\d))?)$/.exec(location.hash||"");
  if(m){
    if(m[1]){ state.step=+m[1].charAt(1); state.r=0; }
    else if(STALLS[m[2]]){ state={step:(m[5]?5:4),li:+(m[5]||0),stall:m[2],r:+m[3],c:+m[4]}; }
  } else {
    var v=load(); if(v){ state={step:(v.step===5?5:4),li:v.li||0,stall:v.stall,kind:v.kind||"",goods:v.goods||"",diffText:v.diffText||"",bossText:v.bossText||"",r:v.r,c:v.c}; }
  }
  render();
})();
</script>
