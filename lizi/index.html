  else { h += '<p class="catnote">'+list.length+' 個例子，點下面卡片最下面的按鈕看他的影片。</p>'; }
  for(var i=0;i<list.length;i++){ h += cardHTML(list[i]); }
  h += footHTML();
  return h;
}

function cardHTML(d){
  var h = '<div class="card">';
  h += '<div class="name">'+esc(d.name)+'</div>';
  h += '<div class="tags">';
  h += '<span class="tag region'+(d.region==="cn"?" cn":"")+'">'+(d.region==="cn"?"中國大陸":"台灣")+'</span>';
  h += '<span class="tag plat">'+esc(d.platform)+'</span>';
  h += '<span class="tag type">'+esc(d.type)+'</span>';
  h += '</div>';
  if(d.note){ h += '<div class="note">⚠ '+esc(d.note)+'</div>'; }
  h += '<div class="row"><b>他紅在哪</b>'+esc(d.why)+'</div>';
  h += '<div class="row"><b>你可以學這招</b>'+esc(d.learn)+'</div>';
  h += '<a class="go" href="'+esc(d.url)+'" target="_blank" rel="noopener">看他的影片 →</a>';
  h += '</div>';
  return h;
}

function footHTML(){
  var h = '<div class="foot">';
  h += '<a class="btn ghost btn" style="background:#FFFFFF;color:#1F6F4A;border:3px solid #1F6F4A" href="../">← 回首頁</a>';
  h += '<a class="btn orange" href="https://shuhaochang2023.github.io/haokang/nine/">打開九宮格 →</a>';
  h += '</div><footer class="pagefoot">好康傳出來｜做得好，也要有人知道</footer>';
  return h;
}

function render(){
  var h = state.cat ? catHTML(state.cat) : homeHTML();
  app.innerHTML = h;
  window.scrollTo(0,0);
  bind();
}
function bind(){
  var bs = document.querySelectorAll("[data-cat]");
  for(var i=0;i<bs.length;i++){ bs[i].onclick = function(){ state.cat = this.getAttribute("data-cat"); render(); }; }
  var q = document.getElementById("tohome");
  if(q){ q.onclick = function(){ state.cat = null; render(); }; }
}
render();
</script>
</body>
</html>
